<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
* {
    box-sizing: border-box;
}

:root {
    --bg: #101114;
    --panel: #17191e;
    --panel2: #1d2026;
    --border: #2b2e36;
    --text: #f5f5f5;
    --muted: #9297a3;
    --accent: #8b5cf6;
    --accent2: #a78bfa;
    --danger: #ef4444;
}

body {
    margin: 0;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    background: var(--bg);
    color: var(--text);
    font-family: "Montserrat", sans-serif;
}

/* =========================
   TOP BAR
========================= */

.topbar {
    height: 56px;
    background: #14161a;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    padding: 0 14px;
    gap: 12px;
    user-select: none;
}

.logo {
    font-size: 17px;
    font-weight: 700;
    letter-spacing: -0.4px;
    margin-right: 12px;
    white-space: nowrap;
}

.logo span {
    color: var(--accent2);
}

.menu {
    position: relative;
}

.menu-button {
    border: 0;
    background: transparent;
    color: #c9ccd4;
    font-family: inherit;
    font-size: 13px;
    padding: 8px 10px;
    border-radius: 6px;
    cursor: pointer;
}

.menu-button:hover {
    background: #22252b;
    color: white;
}

.dropdown {
    position: absolute;
    top: 38px;
    left: 0;
    min-width: 180px;
    background: #1b1e24;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 6px;
    display: none;
    z-index: 1000;
    box-shadow: 0 12px 30px rgba(0,0,0,.4);
}

.menu.open .dropdown {
    display: block;
}

.dropdown button {
    width: 100%;
    text-align: left;
    border: 0;
    background: transparent;
    color: #d5d8df;
    font-family: inherit;
    font-size: 12px;
    padding: 9px 10px;
    border-radius: 5px;
    cursor: pointer;
}

.dropdown button:hover {
    background: #292c33;
    color: white;
}

.spacer {
    flex: 1;
}

.top-button {
    border: 1px solid var(--border);
    background: #1b1e24;
    color: #d9dce3;
    font-family: inherit;
    font-size: 12px;
    padding: 8px 12px;
    border-radius: 6px;
    cursor: pointer;
}

.top-button:hover {
    background: #252830;
    color: white;
}

/* =========================
   MAIN
========================= */

.main {
    height: calc(100vh - 56px);
    display: flex;
}

/* =========================
   LEFT TOOLBAR
========================= */

.toolbar {
    width: 64px;
    background: #15171b;
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 10px 0;
    gap: 5px;
    overflow-y: auto;
}

.tool {
    width: 44px;
    height: 44px;
    border: 0;
    background: transparent;
    color: #9ca1ad;
    border-radius: 8px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 19px;
    position: relative;
}

.tool:hover {
    background: #24272e;
    color: white;
}

.tool.active {
    background: rgba(139,92,246,.2);
    color: var(--accent2);
}

.tool-separator {
    width: 34px;
    height: 1px;
    background: var(--border);
    margin: 4px 0;
}

/* TOOLTIP */

.tooltip {
    position: fixed;
    z-index: 5000;
    background: #08090b;
    border: 1px solid #30333a;
    color: white;
    font-size: 11px;
    padding: 6px 9px;
    border-radius: 5px;
    pointer-events: none;
    opacity: 0;
    transform: translateY(-2px);
    transition: opacity .12s ease, transform .12s ease;
    white-space: nowrap;
}

.tooltip.show {
    opacity: 1;
    transform: translateY(0);
}

/* =========================
   CANVAS AREA
========================= */

.workspace {
    flex: 1;
    min-width: 0;
    position: relative;
    display: flex;
    flex-direction: column;
    background: #0e0f12;
}

.canvas-area {
    flex: 1;
    overflow: auto;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 35px;
}

.canvas-wrap {
    position: relative;
    box-shadow: 0 15px 45px rgba(0,0,0,.45);
    transform-origin: center center;
}

canvas {
    display: block;
    background:
        linear-gradient(45deg, #d5d5d5 25%, transparent 25%),
        linear-gradient(-45deg, #d5d5d5 25%, transparent 25%),
        linear-gradient(45deg, transparent 75%, #d5d5d5 75%),
        linear-gradient(-45deg, transparent 75%, #d5d5d5 75%);
    background-size: 24px 24px;
    background-position: 0 0, 0 12px, 12px -12px, -12px 0;
    background-color: #f1f1f1;
    cursor: crosshair;
}

.canvas-marker {
    position: absolute;
    width: 20px;
    height: 20px;
    border: 2px solid white;
    border-radius: 50%;
    transform: translate(-50%, -50%);
    pointer-events: none;
    box-shadow: 0 0 0 1px rgba(0,0,0,.6), 0 0 15px rgba(167,139,250,.9);
}

/* =========================
   BOTTOM BAR
========================= */

.bottom-bar {
    height: 34px;
    background: #15171b;
    border-top: 1px solid var(--border);
    display: flex;
    align-items: center;
    padding: 0 12px;
    color: var(--muted);
    font-size: 11px;
    gap: 18px;
}

.zoom-controls {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 7px;
}

.zoom-controls button {
    width: 25px;
    height: 23px;
    border: 1px solid var(--border);
    background: #1c1f24;
    color: #cdd0d7;
    border-radius: 4px;
    cursor: pointer;
}

.zoom-controls button:hover {
    background: #292c33;
}

/* =========================
   RIGHT PANEL
========================= */

.right-panel {
    width: 280px;
    background: #15171b;
    border-left: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    overflow: hidden;
}

.panel-section {
    border-bottom: 1px solid var(--border);
    padding: 14px;
}

.panel-title {
    font-size: 11px;
    font-weight: 700;
    color: #bfc3cc;
    text-transform: uppercase;
    letter-spacing: .7px;
    margin-bottom: 13px;
}

.field {
    margin-bottom: 12px;
}

.field label {
    display: block;
    font-size: 11px;
    color: var(--muted);

}

.field input,
.field select {
    width: 100%;
    background: #1d2026;

.field input:focus,

.range-row {

.range-value {

.color-row {

<script>

/* =========================
   CORE
========================= */

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

const canvasWrap = document.getElementById("canvasWrap");
const canvasMarker = document.getElementById("canvasMarker");

let tool = "brush";
let drawing = false;
let startX = 0;
let startY = 0;

let zoom = 1;

let undoStack = [];
let redoStack = [];

let lightmakerOpen = false;
let lightType = "glow";

let lightX = 500;
let lightY = 325;

let draggingLightmaker = false;
let lightmakerDragX = 0;
let lightmakerDragY = 0;

/* =========================
   INITIALIZE
========================= */

function saveState() {

    undoStack.push(
        canvas.toDataURL()
    );

    if (undoStack.length > 50) {
        undoStack.shift();
    }

    redoStack = [];
}

function restoreImage(data) {

    const img = new Image();

    img.onload = () => {

        ctx.clearRect(
            0,
            0,
            canvas.width,
            canvas.height
        );

        ctx.drawImage(
            img,
            0,
            0
        );

    };

    img.src = data;
}

function undo() {

    if (!undoStack.length) return;

    redoStack.push(
        canvas.toDataURL()
    );

    const previous =
        undoStack.pop();

    restoreImage(previous);
}

function redo() {

    if (!redoStack.length) return;

    undoStack.push(
        canvas.toDataURL()
    );

    const next =
        redoStack.pop();

    restoreImage(next);
}

/* =========================
   TOOLS
========================= */

function setTool(newTool, element) {

    tool = newTool;

    document
        .querySelectorAll(".tool")
        .forEach(t => t.classList.remove("active"));

    if (element) {
        element.classList.add("active");
    }

    const names = {
        brush: "Brush Tool",
        eraser: "Eraser Tool",
        move: "Move Tool",
        line: "Line Tool",
        rect: "Rectangle Tool",
        circle: "Circle Tool",
        text: "Text Tool"
    };

    document.getElementById("statusText").textContent =
        names[newTool] || newTool;
}

/* =========================
   CANVAS POSITION
========================= */

function getCanvasPosition(e) {

    const rect =
        canvas.getBoundingClientRect();

    return {
        x:
            (e.clientX - rect.left) *
            (canvas.width / rect.width),

        y:
            (e.clientY - rect.top) *
            (canvas.height / rect.height)
    };
}

/* =========================
   DRAWING
========================= */

canvas.addEventListener("pointerdown", e => {

    if (lightmakerOpen) {

        const pos =
            getCanvasPosition(e);

        setLightPosition(
            pos.x,
            pos.y
        );

        return;
    }

    saveState();

    const pos =
        getCanvasPosition(e);

    startX = pos.x;
    startY = pos.y;

    drawing = true;

    if (tool === "brush" || tool === "eraser") {

        ctx.beginPath();

        ctx.moveTo(
            startX,
            startY
        );

    }

    if (tool === "text") {

        const text =
            prompt("Enter text:");

        if (text) {

            ctx.fillStyle =
                document.getElementById("color").value;

            ctx.globalAlpha =
                Number(
                    document.getElementById("opacity").value
                );

            ctx.font =
                "24px Montserrat";

            ctx.fillText(
                text,
                startX,
                startY
            );

            ctx.globalAlpha = 1;
        }

        drawing = false;
    }

});

canvas.addEventListener("pointermove", e => {

    if (lightmakerOpen) {

        if (e.buttons) {

            const pos =
                getCanvasPosition(e);

            setLightPosition(
                pos.x,
                pos.y
            );

        }

        return;
    }

    if (!drawing) return;

    const pos =
        getCanvasPosition(e);

    const color =
        document.getElementById("color").value;

    const opacity =
        Number(
            document.getElementById("opacity").value
        );

    const size =
        Number(
            document.getElementById("brushSize").value
        );

    ctx.globalAlpha = opacity;

    if (tool === "brush") {

        ctx.globalCompositeOperation =
            "source-over";

        ctx.strokeStyle = color;
        ctx.lineWidth = size;
        ctx.lineCap = "round";
        ctx.lineJoin = "round";

        ctx.lineTo(
            pos.x,
            pos.y
        );

        ctx.stroke();

    }

    if (tool === "eraser") {

        ctx.globalCompositeOperation =
            "destination-out";

        ctx.lineWidth = size;
        ctx.lineCap = "round";

        ctx.lineTo(
            pos.x,
            pos.y
        );

        ctx.stroke();

        ctx.globalCompositeOperation =
            "source-over";
    }

});

canvas.addEventListener("pointerup", e => {

    if (lightmakerOpen) return;

    if (!drawing) return;

    const pos =
        getCanvasPosition(e);

    const color =
        document.getElementById("color").value;

    const opacity =
        Number(
            document.getElementById("opacity").value
        );

    ctx.globalAlpha = opacity;

    if (tool === "line") {

        ctx.strokeStyle = color;
        ctx.lineWidth =
            Number(
                document.getElementById("brushSize").value
            );

        ctx.beginPath();

        ctx.moveTo(
            startX,
            startY
        );

        ctx.lineTo(
            pos.x,
            pos.y
        );

        ctx.stroke();
    }

    if (tool === "rect") {

        ctx.strokeStyle = color;

        ctx.lineWidth =
            Number(
                document.getElementById("brushSize").value
            );

        ctx.strokeRect(
            startX,
            startY,
            pos.x - startX,
            pos.y - startY
        );

    }

    if (tool === "circle") {

        const dx =
            pos.x - startX;

        const dy =
            pos.y - startY;

        const radius =
            Math.sqrt(
                dx * dx +
                dy * dy
            );

        ctx.strokeStyle = color;

        ctx.lineWidth =
            Number(
                document.getElementById("brushSize").value
            );

        ctx.beginPath();

        ctx.arc(
            startX,
            startY,
            radius,
            0,
            Math.PI * 2
        );

        ctx.stroke();

    }

    ctx.globalAlpha = 1;

    drawing = false;

});

canvas.addEventListener("pointerleave", () => {

    if (!lightmakerOpen) {
        drawing = false;
    }

});

/* =========================
   LIGHTMAKER
========================= */

function openLightmaker() {

    lightmakerOpen = true;

    document
        .getElementById("lightmakerPanel")
        .classList.add("open");

    setTool(
        "lightmaker",
        null
    );

    canvasMarker.style.display =
        "block";

    updateLightMarker();

}

function closeLightmaker() {

    lightmakerOpen = false;

    document
        .getElementById("lightmakerPanel")

    canvasMarker.style.display =
        "none";

    setTool(
        "brush",
        document.querySelector(".tool")

}

function selectLightType(type, element) {

    lightType = type;

    document
        .querySelectorAll(".light-type")
        .forEach(button =>
            button.classList.remove("active")
        );

    element.classList.add("active");
}

function setLightPosition(x, y) {

    lightX =
        Math.max(
            0,
            Math.min(canvas.width, x)
        );

    lightY =
        Math.max(
            0,
            Math.min(canvas.height, y)
        );

    document.getElementById("lightX").value =
        Math.round(lightX);

    document.getElementById("lightY").value =
        Math.round(lightY);

    updateLightMarker();
}

function updateLightMarker() {

    canvasMarker.style.left =
        lightX + "px";

    canvasMarker.style.top =
        lightY + "px";

}

document
    .getElementById("lightX")
    .addEventListener("input", e => {

        lightX =
            Number(e.target.value);

        updateLightMarker();

    });

document
    .getElementById("lightY")
    .addEventListener("input", e => {

        lightY =
            Number(e.target.value);

        updateLightMarker();

    });

function applyLight() {

    saveState();

    const intensity =
        Number(
            document.getElementById("lightIntensity").value
        );

    const size =
        Number(
            document.getElementById("lightSize").value
        );

    const color =
        document.getElementById("lightColor").value;

    ctx.save();

    ctx.globalCompositeOperation =
        "screen";

    if (lightType === "glow") {

        drawGlow(
            lightX,
            lightY,
            size,
            color,
            intensity
        );

    }

    if (lightType === "bloom") {

        drawGlow(
            lightX,
            lightY,
            size,
            color,
            intensity
        );

        drawGlow(
            lightX,
            lightY,
            size * .45,
            color,
            intensity * 1.5
        );

    }

    if (lightType === "sunlight") {

        drawGlow(
            lightX,
            lightY,
            size * 1.4,
            color,
            intensity
        );

        drawGlow(
            lightX,
            lightY,
            size * .35,
            "#ffffff",
            intensity
        );

    }

    if (lightType === "spotlight") {

        const gradient =
            ctx.createRadialGradient(
                lightX,
                lightY,
                0,
                lightX,
                lightY,
                size
            );

        gradient.addColorStop(
            0,
            colorWithAlpha(color, intensity)
        );

        gradient.addColorStop(
            .35,
            colorWithAlpha(color, intensity * .5)
        );

        gradient.addColorStop(
            1,
            colorWithAlpha(color, 0)
        );

        ctx.fillStyle =
            gradient;

        ctx.fillRect(
            0,
            0,
            canvas.width,
            canvas.height
        );

    }

    if (lightType === "neon") {

        for (let i = 0; i < 5; i++) {

            drawGlow(
                lightX,
                lightY,
                size * (1 - i * .14),
                color,
                intensity * .35
            );

        }

    }

    if (lightType === "fire") {

        drawGlow(
            lightX,
            lightY,
            size,
            "#ff3300",
            intensity
        );

        drawGlow(
            lightX,
            lightY,
            size * .55,
            "#ff9900",
            intensity * 1.3
        );

        drawGlow(
            lightX,
            lightY,
            size * .22,
            "#fff1a8",
            intensity * 1.5
        );

    }

    ctx.restore();

}

function drawGlow(x, y, radius, color, intensity) {

    const gradient =
        ctx.createRadialGradient(
            x,
            y,
            0,
            x,
            y,
            radius
        );

    gradient.addColorStop(
        0,
        colorWithAlpha(
            color,
            Math.min(1, intensity)
        )
    );

    gradient.addColorStop(
        .2,
        colorWithAlpha(
            color,
            Math.min(.75, intensity * .7)
        )
    );

    gradient.addColorStop(
        .6,
        colorWithAlpha(
            color,
            Math.min(.25, intensity * .25)
        )
    );

    gradient.addColorStop(
        1,
        colorWithAlpha(
            color,
            0
        )
    );

    ctx.fillStyle =
        gradient;

    ctx.beginPath();

    ctx.arc(
        x,
        y,
        radius,
        0,
        Math.PI * 2
    );

    ctx.fill();

}

function colorWithAlpha(hex, alpha) {

    hex =
        hex.replace("#", "");

    const r =
        parseInt(hex.substring(0, 2), 16);

    const g =
        parseInt(hex.substring(2, 4), 16);

    const b =
        parseInt(hex.substring(4, 6), 16);

    return `rgba(${r},${g},${b},${alpha})`;
}

document
    .getElementById("fileInput")
    .addEventListener("change", e => {

        const file =
            e.target.files[0];

        if (!file) return;

        saveState();

        const img =
            new Image();

        img.onload = () => {

            ctx.clearRect(
                0,
                0,
                canvas.width,
                canvas.height
            );

            const scale =
                Math.min(
                    canvas.width / img.width,
                    canvas.height / img.height
                );

            const width =
                img.width * scale;

            const height =
                img.height * scale;

            const x =
                (canvas.width - width) / 2;

            const y =
                (canvas.height - height) / 2;

            ctx.drawImage(
                img,
                x,
                y,
                width,
                height
            );

        };

        img.src =
            URL.createObjectURL(file);

    });

function newCanvas() {

        !confirm(

        )

        0,

    );

/* =========================
   CLEAR
========================= */

function clearCanvas() {

    saveState();

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

}

/* =========================
   RESIZE
========================= */

function resizeCanvas() {

    saveState();

    const oldCanvas =
        document.createElement("canvas");

    oldCanvas.width =
        canvas.width;

    oldCanvas.height =
        canvas.height;

    oldCanvas
        .getContext("2d")
        .drawImage(canvas, 0, 0);

    const width =
        Number(
            document.getElementById("canvasWidth").value
        );

    const height =
        Number(
            document.getElementById("canvasHeight").value
        );

    canvas.width =
        Math.max(1, width);

    canvas.height =
        Math.max(1, height);

    ctx.drawImage(
        oldCanvas,
        0,
        0
    );

    lightX =
        Math.min(
            lightX,
            canvas.width
        );

    lightY =
        Math.min(
            lightY,
            canvas.height
        );

    updateLightMarker();

}

/* =========================
   TRANSFORMS
========================= */

function flipHorizontal() {

    saveState();

    const image =
        ctx.getImageData(
            0,
            0,
            canvas.width,
            canvas.height
        );

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    ctx.save();

    ctx.translate(
        canvas.width,
        0
    );

    ctx.scale(
        -1,
        1
    );

    ctx.putImageData(
        image,
        0,
        0
    );

    ctx.restore();

}

function flipVertical() {

    saveState();

    const image =
        ctx.getImageData(
            0,
            0,
            canvas.width,
            canvas.height
        );

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    ctx.save();

    ctx.translate(
        0,
        canvas.height
    );

    ctx.scale(
        1,
        -1
    );

    ctx.putImageData(
        image,
        0,
        0
    );

    ctx.restore();

}

function rotateCanvas() {

    saveState();

    const temp =
        document.createElement("canvas");

    temp.width =
        canvas.width;

    temp.height =
        canvas.height;

    temp
        .getContext("2d")
        .drawImage(
            canvas,
            0,
            0
        );

    const oldWidth =
        canvas.width;

    const oldHeight =
        canvas.height;

    canvas.width =
        oldHeight;

    canvas.height =
        oldWidth;

    ctx.save();

    ctx.translate(
        canvas.width / 2,
        canvas.height / 2
    );

    ctx.rotate(
        Math.PI / 2
    );

    ctx.drawImage(
        temp,
        -oldWidth / 2,
        -oldHeight / 2
    );

    ctx.restore();

}
