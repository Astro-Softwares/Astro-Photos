```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Astro Photos</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
* {
    box-sizing: border-box;
}

:root {
    --bg: #08090c;
    --panel: #151820;
    --border: #303541;
    --text: #f7f7fa;
    --muted: #8d93a1;
    --accent: #8b5cf6;
    --accent-light: #b197ff;
}

html,
body {
    width: 100%;
    height: 100%;
}

body {
    margin: 0;
    overflow: hidden;

    color: var(--text);

    font-family: "Montserrat", sans-serif;

    background:
        radial-gradient(
            circle at 50% 25%,
            #191c29 0%,
            #0c0e13 42%,
            #07080b 100%
        );
}

/* =========================================================
   TOP BAR
========================================================= */

.topbar {
    height: 58px;

    display: flex;
    align-items: center;

    padding: 0 15px;

    gap: 5px;

    background:
        linear-gradient(
            180deg,
            #242833,
            #171a22 48%,
            #101219
        );

    border-bottom: 1px solid #343947;

    box-shadow:
        0 4px 12px rgba(0,0,0,.55),
        inset 0 1px rgba(255,255,255,.08);

    position: relative;

    z-index: 100;
}

.logo {
    margin-right: 15px;

    font-size: 17px;
    font-weight: 700;

    letter-spacing: -.5px;

    text-shadow:
        0 2px 5px rgba(0,0,0,.8);
}

.logo span {
    color: var(--accent-light);

    text-shadow:
        0 0 14px rgba(139,92,246,.6);
}

.menu {
    position: relative;
}

.menu-button {
    border: 1px solid transparent;

    background: transparent;

    color: #c5c9d2;

    font-family: inherit;

    font-size: 12px;

    padding: 8px 11px;

    border-radius: 7px;

    cursor: pointer;
}

.menu-button:hover {
    color: white;

    background:
        linear-gradient(
            180deg,
            #303542,
            #20242d
        );

    border-color: #3b404d;
}

.dropdown {
    position: absolute;

    top: 43px;
    left: 0;

    min-width: 210px;

    padding: 7px;

    background:
        linear-gradient(
            145deg,
            #252a35,
            #151820
        );

    border: 1px solid #3b404c;

    border-radius: 10px;

    display: none;

    box-shadow:
        0 18px 40px rgba(0,0,0,.7),
        inset 0 1px rgba(255,255,255,.08);

    z-index: 5000;
}

.menu.open .dropdown {
    display: block;
}

.dropdown button {
    width: 100%;

    border: 1px solid transparent;

    background: transparent;

    color: #cdd1da;

    font-family: inherit;

    font-size: 11px;

    padding: 10px;

    text-align: left;

    border-radius: 6px;

    cursor: pointer;
}

.dropdown button:hover {
    color: white;

    background:
        linear-gradient(
            180deg,
            #343945,
            #252933
        );

    border-color: #424754;
}

.dropdown-divider {
    height: 1px;

    margin: 6px 3px;

    background: #353a45;
}

.recent-title {
    padding: 7px 9px 5px;

    color: #777e8c;

    font-size: 8px;
    font-weight: 700;

    text-transform: uppercase;

    letter-spacing: 1px;
}

.recent-empty {
    padding: 9px;

    color: #737987;

    font-size: 10px;
}

.recent-item {
    display: flex;

    align-items: center;

    gap: 9px;

    width: 100%;

    padding: 8px;

    border: 1px solid transparent;

    background: transparent;

    color: #cdd1da;

    font-family: inherit;

    border-radius: 6px;

    cursor: pointer;

    text-align: left;
}

.recent-item:hover {
    color: white;

    background:
        linear-gradient(
            180deg,
            #343945,
            #252933
        );

    border-color: #424754;
}

.recent-thumb {
    width: 30px;
    height: 30px;

    object-fit: cover;

    border-radius: 5px;

    border: 1px solid #444a57;

    background: #0d0f13;
}

.recent-name {
    min-width: 0;

    overflow: hidden;

    white-space: nowrap;

    text-overflow: ellipsis;

    font-size: 9px;
}

.spacer {
    flex: 1;
}

.top-button {
    border: 1px solid #414654;

    background:
        linear-gradient(
            180deg,
            #303540,
            #1b1f27
        );

    color: #e2e4ea;

    font-family: inherit;

    font-size: 11px;
    font-weight: 600;

    padding: 8px 13px;

    border-radius: 7px;

    cursor: pointer;

    box-shadow:
        inset 0 1px rgba(255,255,255,.1),
        inset 0 -2px rgba(0,0,0,.25),
        0 3px 8px rgba(0,0,0,.35);
}

.top-button:hover {
    transform: translateY(-1px);

    background:
        linear-gradient(
            180deg,
            #3b414e,
            #242831
        );
}

.top-button:active {
    transform: translateY(1px);
}

/* =========================================================
   MAIN
========================================================= */

.main {
    height: calc(100vh - 58px);

    display: flex;
}

/* =========================================================
   TOOLBAR
========================================================= */

.toolbar {
    width: 68px;

    display: flex;

    flex-direction: column;

    align-items: center;

    padding: 11px 0;

    gap: 7px;

    background:
        linear-gradient(
            90deg,
            #0e1015,
            #181b23,
            #101219
        );

    border-right: 1px solid #303541;

    box-shadow:
        5px 0 18px rgba(0,0,0,.45);

    z-index: 50;
}

.tool {
    width: 45px;
    height: 43px;

    border: 1px solid #303541;

    border-radius: 9px;

    background:
        linear-gradient(
            145deg,
            #292e39,
            #171a21
        );

    color: #aeb3bf;

    display: flex;

    align-items: center;
    justify-content: center;

    font-size: 18px;

    cursor: pointer;

    position: relative;

    box-shadow:
        inset 0 1px rgba(255,255,255,.09),
        inset 0 -2px rgba(0,0,0,.3),
        0 4px 8px rgba(0,0,0,.4);

    transition: .12s ease;
}

.tool:hover {
    color: white;

    transform: translateY(-2px);

    background:
        linear-gradient(
            145deg,
            #373d4b,
            #20242d
        );
}

.tool:active {
    transform: translateY(1px);
}

.tool.active {
    color: white;

    border-color:
        rgba(167,139,250,.7);

    background:
        linear-gradient(
            145deg,
            #7950d8,
            #4c239e
        );

    box-shadow:
        inset 0 1px rgba(255,255,255,.18),
        0 5px 13px rgba(91,33,182,.45),
        0 0 17px rgba(139,92,246,.25);
}

.tool-separator {
    width: 39px;
    height: 1px;

    margin: 2px 0;

    background:
        linear-gradient(
            90deg,
            transparent,
            #373c48,
            transparent
        );
}

/* =========================================================
   TOOLTIP
========================================================= */

.tooltip {
    position: fixed;

    z-index: 9000;

    padding: 7px 10px;

    background:
        linear-gradient(
            180deg,
            #292d37,
            #15171d
        );

    border: 1px solid #464c59;

    border-radius: 6px;

    color: white;

    font-size: 10px;

    pointer-events: none;

    opacity: 0;

    transform: translateY(-3px);

    transition:
        opacity .15s,
        transform .15s;

    white-space: nowrap;

    box-shadow:
        0 7px 18px rgba(0,0,0,.6);
}

.tooltip.show {
    opacity: 1;

    transform: translateY(0);
}

/* =========================================================
   WORKSPACE
========================================================= */

.workspace {
    flex: 1;

    min-width: 0;

    position: relative;

    display: flex;

    flex-direction: column;

    background:
        radial-gradient(
            circle at center,
            #171a23 0%,
            #0d0f14 55%,
            #090a0e 100%
        );
}

.canvas-area {
    flex: 1;

    overflow: auto;

    position: relative;

    display: flex;

    align-items: center;

    justify-content: center;

    padding: 45px;
}

.canvas-wrap {
    position: relative;

    transform-origin: center center;

    border-radius: 4px;

    box-shadow:
        0 25px 55px rgba(0,0,0,.65),
        0 8px 20px rgba(0,0,0,.5),
        0 0 0 1px rgba(255,255,255,.08);
}

canvas {
    display: block;

    background:
        linear-gradient(45deg,#cfcfcf 25%,transparent 25%),
        linear-gradient(-45deg,#cfcfcf 25%,transparent 25%),
        linear-gradient(45deg,transparent 75%,#cfcfcf 75%),
        linear-gradient(-45deg,transparent 75%,#cfcfcf 75%);

    background-size: 24px 24px;

    background-position:
        0 0,
        0 12px,
        12px -12px,
        -12px 0;

    background-color: #eeeeee;

    cursor: crosshair;
}

.canvas-marker {
    position: absolute;

    width: 21px;
    height: 21px;

    border: 2px solid white;

    border-radius: 50%;

    transform:
        translate(-50%,-50%);

    pointer-events: none;

    box-shadow:
        0 0 0 1px rgba(0,0,0,.7),
        0 0 12px rgba(167,139,250,.9);
}

/* =========================================================
   BOTTOM BAR
========================================================= */

.bottom-bar {
    height: 36px;

    display: flex;

    align-items: center;

    padding: 0 13px;

    gap: 18px;

    background:
        linear-gradient(
            180deg,
            #20242d,
            #13161c
        );

    border-top: 1px solid #343945;

    color: #8f95a2;

    font-size: 10px;
}

.zoom-controls {
    margin-left: auto;

    display: flex;

    align-items: center;

    gap: 7px;
}

.zoom-controls button {
    width: 27px;
    height: 24px;

    border: 1px solid #3c424f;

    border-radius: 5px;

    background:
        linear-gradient(
            180deg,
            #2b303b,
            #181b22
        );

    color: #d5d8df;

    cursor: pointer;
}

/* =========================================================
   RIGHT PANEL
========================================================= */

.right-panel {
    width: 285px;

    display: flex;

    flex-direction: column;

    overflow: hidden;

    background:
        linear-gradient(
            90deg,
            #111319,
            #191c24,
            #12141a
        );

    border-left: 1px solid #303541;

    box-shadow:
        -6px 0 18px rgba(0,0,0,.45);
}

.panel-section {
    padding: 15px;

    border-bottom: 1px solid #2d313b;
}

.panel-title {
    margin-bottom: 13px;

    color: #bfc4ce;

    font-size: 10px;
    font-weight: 700;

    letter-spacing: 1px;

    text-transform: uppercase;
}

.field {
    margin-bottom: 12px;
}

.field label {
    display: block;

    margin-bottom: 6px;

    color: #858b98;

    font-size: 10px;
}

.field input,
.field select {
    width: 100%;

    padding: 9px;

    border: 1px solid #353a46;

    border-radius: 6px;

    outline: none;

    background:
        linear-gradient(
            180deg,
            #11141a,
            #1c2028
        );

    color: white;

    font-family: inherit;

    font-size: 10px;
}

.range-row {
    display: flex;

    align-items: center;

    gap: 9px;
}

.range-row input[type="range"] {
    flex: 1;

    padding: 0;
}

.range-value {
    width: 43px;

    color: #c4c8d0;

    font-size: 9px;

    text-align: right;
}

input[type="range"] {
    accent-color: var(--accent);
}

.color-row {
    display: flex;

    gap: 8px;
}

.color-row input[type="color"] {
    width: 48px;
    height: 35px;

    padding: 3px;

    cursor: pointer;

    border-radius: 6px;
}

.layers {
    flex: 1;

    overflow-y: auto;
}

.layer {
    display: flex;

    align-items: center;

    gap: 9px;

    padding: 8px;

    margin-bottom: 4px;

    border: 1px solid transparent;

    border-radius: 7px;

    color: #bfc3cc;

    font-size: 10px;

    cursor: pointer;
}

.layer:hover,
.layer.selected {
    border-color:
        rgba(139,92,246,.35);

    background:
        linear-gradient(
            180deg,
            rgba(139,92,246,.2),
            rgba(91,33,182,.08)
        );

    color: white;
}

.layer-icon {
    width: 27px;
    height: 27px;

    display: flex;

    align-items: center;
    justify-content: center;

    border: 1px solid #3a3f4b;

    border-radius: 5px;

    background:
        linear-gradient(
            145deg,
            #303541,
            #181b22
        );
}

/* =========================================================
   LIGHTMAKER
========================================================= */

.lightmaker-panel {
    position: fixed;

    width: 520px;

    max-width: calc(100vw - 30px);
    max-height: calc(100vh - 90px);

    overflow-y: auto;

    left: 90px;
    top: 80px;

    display: none;

    background:
        linear-gradient(
            145deg,
            #252a35,
            #111319 70%
        );

    border: 1px solid #464c59;

    border-radius: 13px;

    box-shadow:
        0 35px 80px rgba(0,0,0,.75),
        0 10px 25px rgba(0,0,0,.55),
        inset 0 1px rgba(255,255,255,.1);

    z-index: 3000;
}

.lightmaker-panel.open {
    display: block;

    animation:
        lightmakerIn .18s ease;
}

@keyframes lightmakerIn {

    from {
        opacity: 0;

        transform:
            translateY(-8px)
            scale(.97);
    }

    to {
        opacity: 1;

        transform:
            translateY(0)
            scale(1);
    }
}

.lightmaker-header {
    height: 53px;

    padding: 0 15px;

    display: flex;

    align-items: center;

    border-bottom: 1px solid #373c47;

    background:
        linear-gradient(
            180deg,
            #2a2f3b,
            #1b1e26
        );

    cursor: grab;

    user-select: none;
}

.lightmaker-title {
    font-size: 14px;

    font-weight: 700;
}

.lightmaker-title span {
    color: var(--accent-light);

    text-shadow:
        0 0 14px rgba(139,92,246,.7);
}

.lightmaker-close {
    width: 31px;
    height: 31px;

    margin-left: auto;

    border: 1px solid #3e434f;

    border-radius: 7px;

    background:
        linear-gradient(
            180deg,
            #303541,
            #1b1e25
        );

    color: #aeb3bf;

    font-size: 17px;

    cursor: pointer;

    position: relative;

    z-index: 10;
}

.lightmaker-close:hover {
    color: white;

    background:
        linear-gradient(
            180deg,
            #414754,
            #242831
        );
}

.lightmaker-content {
    padding: 16px;
}

.light-types {
    display: grid;

    grid-template-columns:
        repeat(3,1fr);

    gap: 9px;

    margin-bottom: 17px;
}

.light-type {
    min-height: 75px;

    border: 1px solid #363b47;

    border-radius: 8px;

    background:
        linear-gradient(
            145deg,
            #292e39,
            #171a21
        );

    color: #bfc3cc;

    font-family: inherit;

    font-size: 9px;

    cursor: pointer;
}

.light-type:hover {
    color: white;

    transform: translateY(-2px);
}

.light-type.active {
    border-color:
        rgba(167,139,250,.7);

    background:
        linear-gradient(
            145deg,
            #7048ce,
            #44208f
        );

    color: white;
}

.light-icon {
    font-size: 20px;

    margin-bottom: 7px;
}

.position-grid {
    display: grid;

    grid-template-columns:
        1fr 1fr;

    gap: 10px;
}

.apply-light {
    width: 100%;

    margin-top: 7px;

    padding: 12px;

    border: 1px solid #9c7cf0;

    border-radius: 8px;

    background:
        linear-gradient(
            180deg,
            #9a70f0,
            #6233b6
        );

    color: white;

    font-family: inherit;

    font-size: 11px;

    font-weight: 700;

    cursor: pointer;
}

.status {
    margin-top: 10px;

    padding: 10px;

    border: 1px solid #323743;

    border-radius: 7px;

    background:
        linear-gradient(
            145deg,
            #1e222a,
            #14171d
        );

    color: #808693;

    font-size: 9px;

    line-height: 1.5;
}

/* =========================================================
   SCROLLBAR
========================================================= */

::-webkit-scrollbar {
    width: 8px;
    height: 8px;
}

::-webkit-scrollbar-track {
    background: #0d0f13;
}

::-webkit-scrollbar-thumb {
    background:
        linear-gradient(
            180deg,
            #3c414d,
            #252933
        );

    border-radius: 10px;
}

/* =========================================================
   RESPONSIVE
========================================================= */

@media (max-width: 850px) {

    .right-panel {
        width: 225px;
    }
}

@media (max-width: 650px) {

    .right-panel {
        display: none;
    }

    .toolbar {
        width: 58px;
    }

    .canvas-area {
        padding: 20px;
    }

    .lightmaker-panel {
        left: 70px;
        top: 70px;

        width:
            calc(100vw - 85px);
    }
}
</style>
</head>

<body>

<!-- =====================================================
     TOP BAR
===================================================== -->

<div class="topbar">

    <div class="logo">
        Astro <span>Photos</span>
    </div>

    <!-- FILE -->

    <div class="menu">

        <button
            class="menu-button"
            onclick="toggleMenu(this)"
        >
            File
        </button>

        <div class="dropdown">

            <button onclick="newCanvas();closeMenus()">
                New
            </button>

            <button onclick="openFile();closeMenus()">
                Open / Import
            </button>

            <button onclick="saveAPF();closeMenus()">
                Save Project (.apf)
            </button>

            <button onclick="exportPNG();closeMenus()">
                Export PNG
            </button>

            <div class="dropdown-divider"></div>

            <div class="recent-title">
                Recent Pictures
            </div>

            <div id="recentList">
                <div class="recent-empty">
                    No recent pictures
                </div>
            </div>

            <div class="dropdown-divider"></div>

            <button onclick="clearRecent();closeMenus()">
                Clear Recent Pictures
            </button>

        </div>

    </div>

    <!-- EDIT -->

    <div class="menu">

        <button
            class="menu-button"
            onclick="toggleMenu(this)"
        >
            Edit
        </button>

        <div class="dropdown">

            <button onclick="undo();closeMenus()">
                Undo
            </button>

            <button onclick="redo();closeMenus()">
                Redo
            </button>

            <button onclick="clearCanvas();closeMenus()">
                Clear Canvas
            </button>

        </div>

    </div>

    <!-- IMAGE -->

    <div class="menu">

        <button
            class="menu-button"
            onclick="toggleMenu(this)"
        >
            Image
        </button>

        <div class="dropdown">

            <button onclick="flipHorizontal();closeMenus()">
                Flip Horizontal
            </button>

            <button onclick="flipVertical();closeMenus()">
                Flip Vertical
            </button>

            <button onclick="rotateCanvas();closeMenus()">
                Rotate 90°
            </button>

        </div>

    </div>

    <!-- VIEW -->

    <div class="menu">

        <button
            class="menu-button"
            onclick="toggleMenu(this)"
        >
            View
        </button>

        <div class="dropdown">

            <button onclick="setZoom(.5);closeMenus()">
                50%
            </button>

            <button onclick="setZoom(.75);closeMenus()">
                75%
            </button>

            <button onclick="setZoom(1);closeMenus()">
                100%
            </button>

            <button onclick="setZoom(1.5);closeMenus()">
                150%
            </button>

        </div>

    </div>

    <div class="spacer"></div>

    <button
        class="top-button"
        onclick="openFile()"
    >
        Import
    </button>

    <button
        class="top-button"
        onclick="saveAPF()"
    >
        Save .APF
    </button>

    <button
        class="top-button"
        onclick="exportPNG()"
    >
        PNG
    </button>

</div>

<input
    type="file"
    id="fileInput"
    accept="image/*,.apf"
    hidden
>

<!-- =====================================================
     MAIN
===================================================== -->

<div class="main">

    <!-- TOOLBAR -->

    <div class="toolbar">

        <button
            class="tool active"
            data-tooltip="Brush"
            onclick="setTool('brush',this)"
        >
            🖌
        </button>

        <button
            class="tool"
            data-tooltip="Eraser"
            onclick="setTool('eraser',this)"
        >
            ⌫
        </button>

        <button
            class="tool"
            data-tooltip="Move"
            onclick="setTool('move',this)"
        >
            ✥
        </button>

        <button
            class="tool"
            data-tooltip="Line"
            onclick="setTool('line',this)"
        >
            ╱
        </button>

        <button
            class="tool"
            data-tooltip="Rectangle"
            onclick="setTool('rect',this)"
        >
            ▭
        </button>

        <button
            class="tool"
            data-tooltip="Circle"
            onclick="setTool('circle',this)"
        >
            ○
        </button>

        <button
            class="tool"
            data-tooltip="Text"
            onclick="setTool('text',this)"
        >
            T
        </button>

        <div class="tool-separator"></div>

        <button
            class="tool"
            data-tooltip="Lightmaker"
            onclick="openLightmaker()"
        >
            ✨
        </button>

        <div class="tool-separator"></div>

        <button
            class="tool"
            data-tooltip="Undo"
            onclick="undo()"
        >
            ↶
        </button>

        <button
            class="tool"
            data-tooltip="Redo"
            onclick="redo()"
        >
            ↷
        </button>

        <button
            class="tool"
            data-tooltip="Clear Canvas"
            onclick="clearCanvas()"
        >
            🗑
        </button>

    </div>

    <!-- WORKSPACE -->

    <div class="workspace">

        <div class="canvas-area">

            <div
                class="canvas-wrap"
                id="canvasWrap"
            >

                <canvas
                    id="canvas"

<script>

/* =========================================================
   CORE
========================================================= */

const canvas =
    document.getElementById("canvas");

const ctx =
    canvas.getContext("2d");

const canvasMarker =
    document.getElementById("canvasMarker");

const lightmakerPanel =
    document.getElementById("lightmakerPanel");

const lightmakerHeader =
    document.getElementById("lightmakerHeader");

const lightmakerClose =
    document.getElementById("lightmakerClose");

let tool = "brush";

let drawing = false;

let startX = 0;
let startY = 0;

let zoom = 1;

let undoStack = [];
let redoStack = [];

let lightmakerOpen = false;

let lightType = "glow";

let lightX = 500;
let lightY = 325;

let draggingLightmaker = false;

let lightmakerDragX = 0;
let lightmakerDragY = 0;

/* =========================================================
   MENU SYSTEM
========================================================= */

function toggleMenu(button) {

    const menu =
        button.parentElement;

    document
        .querySelectorAll(".menu")
        .forEach(m => {

            if (m !== menu) {
                m.classList.remove("open");
            }

        });

    menu.classList.toggle("open");
}

function closeMenus() {

    document
        .querySelectorAll(".menu")
        .forEach(menu =>
            menu.classList.remove("open")
        );
}

document.addEventListener(
    "click",
    e => {

        if (!e.target.closest(".menu")) {
            closeMenus();
        }

    }
);

/* =========================================================
   RECENT PICTURES
========================================================= */

const RECENT_KEY =
    "astroPhotosRecent";

const MAX_RECENT =
    8;

function getRecent() {

    try {

        return JSON.parse(
            localStorage.getItem(
                RECENT_KEY
            )
        ) || [];

    } catch {

        return [];

    }
}

function saveRecent(
    name,
    data
) {

    let recent =
        getRecent();

    recent =
        recent.filter(
            item =>
                item.name !== name
        );

    recent.unshift({
        name: name,
        data: data,
        width: canvas.width,
        height: canvas.height,
        time: Date.now()
    });

    recent =
        recent.slice(
            0,
            MAX_RECENT
        );

    try {

        localStorage.setItem(
            RECENT_KEY,
            JSON.stringify(recent)
        );

    } catch {

        /*
           Browser storage can fill up if
           very large pictures are stored.
        */

        recent =
            recent.slice(
                0,
                3
            );

        try {

            localStorage.setItem(
                RECENT_KEY,
                JSON.stringify(recent)
            );

        } catch {}

    }

    renderRecent();
}

function renderRecent() {

    const list =
        document.getElementById(
            "recentList"
        );

    const recent =
        getRecent();

    list.innerHTML = "";

    if (!recent.length) {

        list.innerHTML =
            `<div class="recent-empty">
                No recent pictures
            </div>`;

        return;
    }

    recent.forEach(
        (item,index) => {

            const button =
                document.createElement(
                    "button"
                );

            button.className =
                "recent-item";

            button.title =
                item.name;

            button.innerHTML = `
                <img
                    class="recent-thumb"
                    src="${item.data}"
                >
                <span class="recent-name">
                    ${escapeHTML(item.name)}
                </span>
            `;

            button.addEventListener(
                "click",
                () => {

                    loadRecent(index);

                    closeMenus();

                }
            );

            list.appendChild(
                button
            );

        }
    );
}

function loadRecent(index) {

    const recent =
        getRecent();

    const item =
        recent[index];

    if (!item)
        return;

    const img =
        new Image();

    img.onload = () => {

        canvas.width =
            item.width;

        canvas.height =
            item.height;

        ctx.clearRect(
            0,
            0,
            canvas.width,
            canvas.height
        );

        ctx.drawImage(
            img,
            0,
            0,
            canvas.width,
            canvas.height
        );

        updateCanvasInfo();

        document.getElementById(
            "canvasWidth"
        ).value =
            canvas.width;

        document.getElementById(
            "canvasHeight"
        ).value =
            canvas.height;

        document.getElementById(
            "statusText"
        ).textContent =
            "Opened " + item.name;

    };

    img.src =
        item.data;
}

function clearRecent() {

    if (
        !confirm(
            "Clear your recent pictures?"
        )
    )
        return;

    localStorage.removeItem(
        RECENT_KEY
    );

    renderRecent();
}

function escapeHTML(text) {

    return String(text)
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
}

/* =========================================================
   APF PROJECT FORMAT
========================================================= */

function saveAPF() {

    const project = {

        format: "APF",

        version: 1,

        application:
            "Astro Photos",

        created:
            new Date().toISOString(),

        width:
            canvas.width,

        height:
            canvas.height,

        image:
            canvas.toDataURL(
                "image/png"
            )

    };

    const blob =
        new Blob(
            [
                JSON.stringify(
                    project
                )
            ],
            {
                type:
                    "application/x-astro-photos"
            }
        );

    const url =
        URL.createObjectURL(
            blob
        );

    const link =
        document.createElement("a");

    link.href =
        url;

    link.download =
        "astro-project.apf";

    document.body.appendChild(
        link
    );

    link.click();

    link.remove();

    URL.revokeObjectURL(
        url
    );

    /*
       Save the current project
       into Recent Pictures too.
    */

    saveRecent(
        "astro-project.apf",
        project.image
    );

    document.getElementById(
        "statusText"
    ).textContent =
        "Project saved as .APF";
}

/* =========================================================
   OPEN FILE
========================================================= */

function openFile() {

    document
        .getElementById(
            "fileInput"
        )
        .click();
}

document
    .getElementById(
        "fileInput"
    )
    .addEventListener(
        "change",
        e => {

            const file =
                e.target.files[0];

            if (!file)
                return;

            if (
                file.name
                    .toLowerCase()
                    .endsWith(".apf")
            ) {

                openAPF(file);

            } else {

                openImage(file);

            }

            e.target.value = "";

        }
    );

/* =========================================================
   OPEN APF
========================================================= */

function openAPF(file) {

    const reader =
        new FileReader();

    reader.onload = () => {

        try {

            const project =
                JSON.parse(
                    reader.result
                );

            if (
                project.format !==
                "APF"
            ) {

                throw new Error(
                    "Invalid APF file"
                );
            }

            if (
                !project.image ||
                !project.width ||
                !project.height
            ) {

                throw new Error(
                    "Incomplete APF file"
                );
            }

            const img =
                new Image();

            img.onload = () => {

                canvas.width =
                    project.width;

                canvas.height =
                    project.height;

                ctx.clearRect(
                    0,
                    0,
                    canvas.width,
                    canvas.height
                );

                ctx.drawImage(
                    img,
                    0,
                    0,
                    canvas.width,
                    canvas.height
                );

                document.getElementById(
                    "canvasWidth"
                ).value =
                    canvas.width;

                document.getElementById(
                    "canvasHeight"
                ).value =
                    canvas.height;

                updateCanvasInfo();

                saveRecent(
                    file.name,
                    project.image
                );

                document.getElementById(
                    "statusText"
                ).textContent =
                    "Opened " +
                    file.name;
            };

            img.src =
                project.image;

        } catch(error) {

            alert(
                "This doesn't appear to be a valid Astro Photos .APF project."
            );

            console.error(error);

        }

    };

    reader.readAsText(file);
}

/* =========================================================
   OPEN IMAGE
========================================================= */

function openImage(file) {

    saveState();

    const img =
        new Image();

    img.onload = () => {

        ctx.clearRect(
            0,
            0,
            canvas.width,
            canvas.height
        );

        const scale =
            Math.min(
                canvas.width /
                    img.width,

                canvas.height /
                    img.height
            );

        const width =
            img.width * scale;

        const height =
            img.height * scale;

        const x =
            (
                canvas.width -
                width
            ) / 2;

        const y =
            (
                canvas.height -
                height
            ) / 2;

        ctx.drawImage(
            img,
            x,
            y,
            width,
            height
        );

        /*
           Store a copy in Recent Pictures.
        */

        saveRecent(
            file.name,
            canvas.toDataURL(
                "image/jpeg",
                .75
            )
        );

        document.getElementById(
            "statusText"
        ).textContent =
            "Opened " + file.name;
    };

    img.src =
        URL.createObjectURL(
            file
        );
}

/* =========================================================
   HISTORY
========================================================= */

function saveState() {

    undoStack.push(
        canvas.toDataURL()
    );

    if (
        undoStack.length > 50
    ) {

        undoStack.shift();

    }

    redoStack = [];
}

function restoreImage(data) {

    const img =
        new Image();

    img.onload = () => {

        ctx.clearRect(
            0,
            0,
            canvas.width,
            canvas.height
        );

        ctx.drawImage(
            img,
            0,
            0
        );

    };

    img.src =
        data;
}

function undo() {

    if (!undoStack.length)
        return;

    redoStack.push(
        canvas.toDataURL()
    );

    restoreImage(
        undoStack.pop()
    );
}

function redo() {

    if (!redoStack.length)
        return;

    undoStack.push(
        canvas.toDataURL()
    );

    restoreImage(
        redoStack.pop()
    );
}

/* =========================================================
   TOOLS
========================================================= */

function setTool(
    newTool,
    element
) {

    tool =
        newTool;

    document
        .querySelectorAll(".tool")
        .forEach(t =>
            t.classList.remove(
                "active"
            )
        );

    if (element) {

        element.classList.add(
            "active"
        );

    }

    const names = {

        brush:
            "Brush Tool",

        eraser:
            "Eraser Tool",

        move:
            "Move Tool",

        line:
            "Line Tool",

        rect:
            "Rectangle Tool",

        circle:
            "Circle Tool",

        text:
            "Text Tool",

        lightmaker:
            "Lightmaker"

    };

    document.getElementById(
        "statusText"
    ).textContent =
        names[newTool] ||
        newTool;
}

/* =========================================================
   CANVAS POSITION
========================================================= */

function getCanvasPosition(e) {

    const rect =
        canvas.getBoundingClientRect();

    return {

        x:
            (e.clientX -
                rect.left) *
            (
                canvas.width /
                rect.width
            ),

        y:
            (e.clientY -
                rect.top) *
            (
                canvas.height /
                rect.height
            )

    };
}

/* =========================================================
   DRAWING
========================================================= */

canvas.addEventListener(
    "pointerdown",
    e => {

        if (lightmakerOpen) {

            const pos =
                getCanvasPosition(e);

            setLightPosition(
                pos.x,
                pos.y
            );

            return;
        }

        saveState();

        const pos =
            getCanvasPosition(e);

        startX =
            pos.x;

        startY =
            pos.y;

        drawing =
            true;

        if (
            tool === "brush" ||
            tool === "eraser"
        ) {

            ctx.beginPath();

            ctx.moveTo(
                startX,
                startY
            );
        }

        if (
            tool === "text"
        ) {

            const text =
                prompt(
                    "Enter text:"
                );

            if (text) {

                ctx.fillStyle =
                    document.getElementById(
                        "color"
                    ).value;

                ctx.globalAlpha =
                    Number(
                        document.getElementById(
                            "opacity"
                        ).value
                    );

                ctx.font =
                    "24px Montserrat";

                ctx.fillText(
                    text,
                    startX,
                    startY
                );

                ctx.globalAlpha =
                    1;
            }

            drawing =
                false;
        }
    }
);

canvas.addEventListener(
    "pointermove",
    e => {

        if (lightmakerOpen) {

            if (e.buttons) {

                const pos =
                    getCanvasPosition(e);

                setLightPosition(
                    pos.x,
                    pos.y
                );

            }

            return;
        }

        if (!drawing)
            return;

        const pos =
            getCanvasPosition(e);

        const color =
            document.getElementById(
                "color"
            ).value;

        const opacity =
            Number(
                document.getElementById(
                    "opacity"
                ).value
            );

        const size =
            Number(
                document.getElementById(
                    "brushSize"
                ).value
            );

        ctx.globalAlpha =
            opacity;

        if (
            tool === "brush"
        ) {

            ctx.globalCompositeOperation =
                "source-over";

            ctx.strokeStyle =
                color;

            ctx.lineWidth =
                size;

            ctx.lineCap =
                "round";

            ctx.lineJoin =
                "round";

            ctx.lineTo(
                pos.x,
                pos.y
            );

            ctx.stroke();
        }

        if (
            tool === "eraser"
        ) {

            ctx.globalCompositeOperation =
                "destination-out";

            ctx.lineWidth =
                size;

            ctx.lineCap =
                "round";

            ctx.lineTo(
                pos.x,
                pos.y
            );

            ctx.stroke();

            ctx.globalCompositeOperation =
                "source-over";
        }
    }
);

canvas.addEventListener(
    "pointerup",
    e => {

        if (lightmakerOpen)
            return;

        if (!drawing)
            return;

        const pos =
            getCanvasPosition(e);

        const color =
            document.getElementById(
                "color"
            ).value;

        const size =
            Number(
                document.getElementById(
                    "brushSize"
                ).value
            );

        ctx.globalAlpha =
            1;

        if (
            tool === "line"
        ) {

            ctx.strokeStyle =
                color;

            ctx.lineWidth =
                size;

            ctx.beginPath();

            ctx.moveTo(
                startX,
                startY
            );

            ctx.lineTo(
                pos.x,
                pos.y
            );

            ctx.stroke();
        }

        if (
            tool === "rect"
        ) {

            ctx.strokeStyle =
                color;

            ctx.lineWidth =
                size;

            ctx.strokeRect(
                startX,
                startY,
                pos.x - startX,
                pos.y - startY
            );
        }

        if (
            tool === "circle"
        ) {

            const dx =
                pos.x - startX;

            const dy =
                pos.y - startY;

            const radius =
                Math.sqrt(
                    dx * dx +
                    dy * dy
                );

            ctx.strokeStyle =
                color;

            ctx.lineWidth =
                size;

            ctx.beginPath();

            ctx.arc(
                startX,
                startY,
                radius,
                0,
                Math.PI * 2
            );

            ctx.stroke();
        }

        drawing =
            false;
    }
);

canvas.addEventListener(
    "pointerleave",
    () => {

        if (!lightmakerOpen) {

            drawing =
                false;

        }

    }
);

/* =========================================================
   LIGHTMAKER
========================================================= */

function openLightmaker() {

    lightmakerOpen =
        true;

    lightmakerPanel.classList.add(
        "open"
    );

    canvasMarker.style.display =
        "block";

    setTool(
        "lightmaker",
        null
    );

    updateLightMarker();
}

function closeLightmaker() {

    lightmakerOpen =
        false;

    lightmakerPanel.classList.remove(
        "open"
    );

    canvasMarker.style.display =
        "none";

    draggingLightmaker =
        false;

    const brushButton =
        document.querySelector(
            '.tool[data-tooltip="Brush"]'
        );

    setTool(
        "brush",
        brushButton
    );
}

/*
   FIX:
   The X button no longer activates
   the draggable header.
*/

lightmakerClose.addEventListener(
    "pointerdown",
    e => {

        e.preventDefault();

        e.stopPropagation();

    }
);

lightmakerClose.addEventListener(
    "click",
    e => {

        e.preventDefault();

        e.stopPropagation();

        closeLightmaker();

    }
);

/* =========================================================
   LIGHT TYPES
========================================================= */

function selectLightType(
    type,
    element
) {

    lightType =
        type;

    document
        .querySelectorAll(
            ".light-type"
        )
        .forEach(
            button =>
                button.classList.remove(
                    "active"
                )
        );

    element.classList.add(
        "active"
    );
}

/* =========================================================
   LIGHT POSITION
========================================================= */

function setLightPosition(
    x,
    y
) {

    lightX =
        Math.max(
            0,
            Math.min(
                canvas.width,
                x
            )
        );

    lightY =
        Math.max(
            0,
            Math.min(
                canvas.height,
                y
            )
        );

    document.getElementById(
        "lightX"
    ).value =
        Math.round(
            lightX
        );

    document.getElementById(
        "lightY"
    ).value =
        Math.round(
            lightY
        );

    updateLightMarker();
}

        lightX + "px";

    canvasMarker.style.top =

}

/* =========================================================
   LIGHT EFFECTS
========================================================= */

function applyLight() {

    saveState();

    const intensity =
        Number(
            document.getElementById(
                "lightIntensity"
            ).value
        );

    const size =
        Number(
            document.getElementById(
                "lightSize"
            ).value
        );

    const color =
        document.getElementById(
            "lightColor"
        ).value;

    ctx.save();

    ctx.globalCompositeOperation =
        "screen";

    if (
        lightType ===
        "glow"
    ) {

        drawGlow(
            lightX,
            lightY,
            size,
            color,
            intensity
        );

    }

    if (
        lightType ===
        "bloom"
    ) {

        drawGlow(
            lightX,
            lightY,
            size,
            color,
            intensity
        );

        drawGlow(
            lightX,
            lightY,
            size * .45,
            color,
            intensity * 1.5
        );

    }

    if (
        lightType ===
        "sunlight"
    ) {

        drawGlow(
            lightX,
            lightY,
            size * 1.4,
            color,
            intensity
        );

        drawGlow(
            lightX,
            lightY,
            size * .35,
            "#ffffff",
            intensity
        );

    }

    if (
        lightType ===
        "spotlight"
    ) {

        const gradient =
            ctx.createRadialGradient(
                lightX,
                lightY,
                0,
                lightX,
                lightY,
                size
            );

        gradient.addColorStop(
            0,
            colorWithAlpha(
                color,
                intensity
            )
        );

        gradient.addColorStop(
            .35,
            colorWithAlpha(
                color,
                intensity * .5
            )
        );

        gradient.addColorStop(
            1,
            colorWithAlpha(
                color,
                0
            )
        );

        ctx.fillStyle =
            gradient;

        ctx.fillRect(
            0,
            0,
            canvas.width,
            canvas.height
        );
    }

    if (
        lightType ===
        "neon"
    ) {

        for (
            let i = 0;
            i < 5;
            i++
        ) {

            drawGlow(
                lightX,
                lightY,
                size *
                    (1 - i * .14),
                color,
                intensity * .35
            );

        }

    }

    if (
        lightType ===
        "fire"
    ) {

        drawGlow(
            lightX,
            lightY,
            size,
            "#ff3300",
            intensity
        );

        drawGlow(
            lightX,
            lightY,
            size * .55,
            "#ff9900",
            intensity * 1.3
        );

        drawGlow(
            lightX,
            lightY,
            size * .22,
            "#fff1a8",
            intensity * 1.5
        );

    }

    ctx.restore();
}

function drawGlow(
    x,
    y,
    radius,
    color,
    intensity
) {

    const gradient =
        ctx.createRadialGradient(
            x,
            y,
            0,
            x,
            y,
            radius
        );

    gradient.addColorStop(
        0,
        colorWithAlpha(
            color,
            Math.min(
                1,
                intensity
            )
        )
    );

    gradient.addColorStop(
        .2,
        colorWithAlpha(
            color,
            Math.min(
                .75,
                intensity * .7
            )
        )
    );

    gradient.addColorStop(
        .6,
        colorWithAlpha(
            color,
            Math.min(
                .25,
                intensity * .25
            )
        )
    );

    gradient.addColorStop(
        1,
        colorWithAlpha(
            color,
            0
        )
    );

    ctx.fillStyle =
        gradient;

    ctx.beginPath();

    ctx.arc(
        x,
        y,
        radius,
        0,
        Math.PI * 2
    );

    ctx.fill();
}

function colorWithAlpha(
    hex,
    alpha
) {

    hex =
        hex.replace(
            "#",
            ""
        );

    const r =
        parseInt(
            hex.substring(0,2),
            16
        );

    const g =
        parseInt(
            hex.substring(2,4),
            16
        );

    const b =
        parseInt(
            hex.substring(4,6),
            16
        );

    return `
        rgba(
            ${r},
            ${g},
            ${b},
            ${alpha}
        )
    `;
}

lightmakerHeader.addEventListener(
    "pointerdown",
    e => {

        if (
            e.target ===
                lightmakerClose ||
            lightmakerClose.contains(
                e.target
            )
        ) {

            return;

        }

        draggingLightmaker =
            true;

        const rect =
            lightmakerPanel
                .getBoundingClientRect();

        lightmakerDragX =
            e.clientX -
            rect.left;

        lightmakerDragY =
            e.clientY -
            rect.top;

        lightmakerHeader.setPointerCapture(
            e.pointerId
        );
    }
);

lightmakerHeader.addEventListener(
    "pointermove",
    e => {

        if (
            !draggingLightmaker
        )
            return;

        let newLeft =
            e.clientX -
            lightmakerDragX;

        let newTop =
            e.clientY -
            lightmakerDragY;

        const maxLeft =
            window.innerWidth -
            lightmakerPanel.offsetWidth;

        const maxTop =
            window.innerHeight -
            lightmakerPanel.offsetHeight;

        newLeft =
            Math.max(
                5,
                Math.min(
                    newLeft,
                    maxLeft - 5
                )
            );

        newTop =
            Math.max(
                58,
                Math.min(
                    newTop,
                    maxTop - 5
                )
            );

        lightmakerPanel.style.left =
            newLeft + "px";

        lightmakerPanel.style.top =
            newTop + "px";
    }
);

lightmakerHeader.addEventListener(
    "pointerup",
    () => {

        draggingLightmaker =
            false;

    }
);

function resizeCanvas() {

    saveState();

    const oldCanvas =
        document.createElement(
            "canvas"
        );

    oldCanvas.width =
        canvas.width;

    oldCanvas.height =
        canvas.height;

    oldCanvas
        .getContext("2d")
        .drawImage(
            canvas,
            0,
            0
        );

    const width =
        Number(
            document.getElementById(
                "canvasWidth"
            ).value
        );

    const height =
        Number(
            document.getElementById(
                "canvasHeight"
            ).value
        );

    canvas.width =
        Math.max(
            1,
            width
        );

    canvas.height =
        Math.max(
            1,
            height
        );

    ctx.drawImage(
        oldCanvas,
        0,
        0
    );

    updateCanvasInfo();

    lightX =
        Math.min(
            lightX,
            canvas.width
        );

    lightY =
        Math.min(
            lightY,
            canvas.height
        );

    updateLightMarker();
}

/* =========================================================
   FLIP
========================================================= */

function flipHorizontal() {

    saveState();

    const image =
        ctx.getImageData(
            0,
            0,
            canvas.width,
            canvas.height
        );

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    ctx.save();

    ctx.translate(
        canvas.width,
        0
    );

    ctx.scale(
        -1,
        1
    );

    ctx.putImageData(
        image,
        0,
        0
    );

    ctx.restore();
}

function flipVertical() {

    saveState();

    const image =
        ctx.getImageData(
            0,
            0,
            canvas.width,
            canvas.height
        );

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    ctx.save();

    ctx.translate(
        0,
        canvas.height
    );

    ctx.scale(
        1,
        -1
    );

    ctx.putImageData(
        image,
        0,
        0
    );

    ctx.restore();
}

/* =========================================================
   ROTATE
========================================================= */

function rotateCanvas() {

    saveState();

    const temp =
        document.createElement(
            "canvas"
        );

    temp.width =
        canvas.width;

    temp.height =
        canvas.height;

    temp
        .getContext("2d")
        .drawImage(
            canvas,
            0,
            0
        );

    const oldWidth =
        canvas.width;

    const oldHeight =
        canvas.height;

    canvas.width =
        oldHeight;

    canvas.height =
        oldWidth;

    ctx.save();

    ctx.translate(
        canvas.width / 2,
        canvas.height / 2
    );

    ctx.rotate(
        Math.PI / 2
    );

    ctx.drawImage(
        temp,
        -oldWidth / 2,
        -oldHeight / 2
    );

    ctx.restore();

    updateCanvasInfo();
}
